<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物连连看</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.instructions {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }

        .game-board {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            border: 3px solid transparent;
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .image-card {
            height: 100px;
            background-size: cover;
            background-position: center;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name-card {
            height: 100px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #444;
        }

        /* 选中状态 */
        .card.selected {
            border-color: #2196F3;
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.4);
        }

        /* 匹配成功状态 */
        .card.matched {
            border-color: var(--primary-color);
            background-color: #e8f5e9;
            color: var(--primary-color);
            cursor: default;
            transform: scale(0.98);
            opacity: 0.8;
        }

        .card.matched img {
            opacity: 0.6;
        }

        /* 匹配错误状态 */
        .card.wrong {
            border-color: #f44336;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* 胜利提示 */
        #win-message {
            display: none;
            margin-top: 30px;
            font-size: 22px;
            color: var(--primary-color);
            font-weight: bold;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .game-board {
                flex-direction: column;
            }
            .column {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            .card {
                width: 45%;
                height: 80px;
            }
            .name-card {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <h1>🌿 植物连连看 🌿</h1>
    <p class="instructions">点击左侧的植物图片，再点击右侧对应的植物名称，将它们配对起来吧！<br>
    </p>

    <div class="game-board">
        <div class="column" id="image-column">
            <!-- 图片卡片将通过JS生成 -->
        </div>
        <div class="column" id="name-column">
            <!-- 名称卡片将通过JS生成 -->
        </div>
    </div>

    <div id="win-message">🎉 恭喜你！全部分类正确！ 🎉</div>

    <script>
        // 植物数据（根据你上传的图片顺序和特征识别）
        const plants = [
            { id: 1, name: '悬铃木', img: '2.png' },
            { id: 2, name: '广玉兰', img: '3.png' },
            { id: 3, name: '栾树', img: '4.png' },
            { id: 4, name: '雪松', img: '5.png' },
            { id: 5, name: '鹅掌楸', img: '6.png' },
            { id: 6, name: '水杉', img: '7.png' },
            { id: 7, name: '樱花', img: '8.png' },
            { id: 8, name: '桂花', img: '9.png' },
            { id: 9, name: '合欢', img: '10.png' },
            { id: 10, name: '香樟', img: '1.png' }
        ];

        let firstSelection = null;
        let secondSelection = null;
        let isProcessing = false;
        let matchedCount = 0;

        // 打乱数组函数
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 初始化游戏
        function initGame() {
            const imageColumn = document.getElementById('image-column');
            const nameColumn = document.getElementById('name-column');
            
            imageColumn.innerHTML = '';
            nameColumn.innerHTML = '';
            
            // 生成打乱后的数据
            const shuffledImages = shuffleArray([...plants]);
            const shuffledNames = shuffleArray([...plants]);

            // 渲染图片列
            shuffledImages.forEach(plant => {
                const card = document.createElement('div');
                card.classList.add('card', 'image-card');
                card.dataset.id = plant.id;
                
                // 图片加载
                const img = document.createElement('img');
                img.src = plant.img;
                img.alt = plant.name;
                // 如果图片加载失败，显示提示文字
                img.onerror = function() {
                    this.style.display = 'none';
                    card.innerHTML = `<span style="font-size:12px; color:#999; text-align:center;">缺少图片<br>${plant.img}</span>`;
                };
                
                card.appendChild(img);
                card.addEventListener('click', () => handleSelection(card, 'image'));
                imageColumn.appendChild(card);
            });

            // 渲染名称列
            shuffledNames.forEach(plant => {
                const card = document.createElement('div');
                card.classList.add('card', 'name-card');
                card.dataset.id = plant.id;
                card.textContent = plant.name;
                card.addEventListener('click', () => handleSelection(card, 'name'));
                nameColumn.appendChild(card);
            });
        }

        // 处理点击选择
        function handleSelection(card, type) {
            if (isProcessing || card.classList.contains('matched') || card === firstSelection) return;

            card.classList.add('selected');

            if (!firstSelection) {
                // 第一次选择
                firstSelection = card;
            } else {
                // 第二次选择
                secondSelection = card;
                
                // 判断是否属于同一列（防止点击同一列的卡片）
                const firstType = firstSelection.classList.contains('image-card') ? 'image' : 'name';
                if (firstType === type) {
                    // 如果点击了同一列，取消之前的选中，选中新的
                    firstSelection.classList.remove('selected');
                    firstSelection = card;
                    return;
                }

                checkMatch();
            }
        }

        // 检查匹配
        function checkMatch() {
            isProcessing = true;
            const id1 = firstSelection.dataset.id;
            const id2 = secondSelection.dataset.id;

            if (id1 === id2) {
                // 匹配成功
                setTimeout(() => {
                    firstSelection.classList.remove('selected');
                    secondSelection.classList.remove('selected');
                    firstSelection.classList.add('matched');
                    secondSelection.classList.add('matched');
                    
                    resetSelection();
                    matchedCount++;
                    
                    if (matchedCount === plants.length) {
                        document.getElementById('win-message').style.display = 'block';
                    }
                }, 300);
            } else {
                // 匹配失败
                firstSelection.classList.add('wrong');
                secondSelection.classList.add('wrong');
                
                setTimeout(() => {
                    firstSelection.classList.remove('selected', 'wrong');
                    secondSelection.classList.remove('selected', 'wrong');
                    resetSelection();
                }, 800);
            }
        }

        // 重置选择状态
        function resetSelection() {
            firstSelection = null;
            secondSelection = null;
            isProcessing = false;
        }

        // 启动游戏
        window.onload = initGame;
    </script>
</body>
</html>
